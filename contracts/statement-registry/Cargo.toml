[package]
name = "statement-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Test-only, for parsing fixtures/merkle/*.json against merkle::fold(). Not
# a new external dependency in practice: soroban-sdk already pulls in
# serde_json 1.0.151 transitively (see Cargo.lock), so this adds no new
# crate to the build, only a direct dev-dependency edge to one already
# being compiled.
serde_json = "1"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false
